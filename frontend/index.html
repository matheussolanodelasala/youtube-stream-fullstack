<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Plataforma de streaming de video">
    <title>YouTube Stream</title>
    <style>
        :root {
            --bg-main: #0f0f0f;
            --bg-surface: #212121;
            --bg-hover: #3f3f3f;
            --border: #303030;
            --text-main: #f1f1f1;
            --text-secondary: #aaa;
            --accent: #ff0000;
            --header-h: 56px;
            --bottom-nav-h: 56px;
            --transition: 0.25s ease;
        }


        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Roboto, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            /* CSS Grid: estructura general de la página (Mobile First) */
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: var(--header-h) 1fr var(--bottom-nav-h);
            grid-template-areas:
                "header"
                "main"
                "nav";
            min-height: 100vh;
        }

        .site-header {
            grid-area: header;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            background-color: var(--bg-main);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 1.2rem;
            color: inherit;
            text-decoration: none;
        }

        .logo-icon {
            background-color: var(--accent);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            transition: transform var(--transition);
        }

        .logo-area:hover .logo-icon {
            transform: scale(1.08);
        }

        .search-bar {
            flex: 1;
            max-width: 600px;
            min-width: 0;
            background: #121212;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 16px;
            color: #fff;
            font-size: 1rem;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .search-bar:focus {
            outline: none;
            border-color: #3ea6ff;
            box-shadow: 0 0 0 2px rgba(62, 166, 255, 0.25);
        }

        .account {
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .sidebar {
            grid-area: nav;
            position: sticky;
            bottom: 0;
            background-color: var(--bg-main);
            border-top: 1px solid var(--border);
            z-index: 100;
        }

        .sidebar ul {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100%;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            font-size: 0.75rem;
            color: var(--text-main);
            text-decoration: none;
            border-radius: 8px;
            transition: background-color var(--transition), transform var(--transition);
        }

        .nav-item:hover,
        .nav-item:focus-visible {
            background-color: var(--bg-hover);
            transform: translateY(-2px);
        }

        .content {
            grid-area: main;
            padding: 16px;
            overflow-y: auto;
        }

        .status-message {
            margin: 24px 0;
            text-align: center;
            color: var(--text-secondary);
        }


        .video-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }


        .video-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: pointer;
            animation: fadeInUp 0.5s ease both;
            transition: transform var(--transition);
        }

        .video-card:hover,
        .video-card:focus-visible {
            transform: translateY(-4px);
            outline: none;
        }

        .video-player-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            transition: border-radius var(--transition), box-shadow var(--transition);
        }

        .video-card:hover .video-player-wrapper,
        .video-card:focus-visible .video-player-wrapper {
            border-radius: 4px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
        }

        .video-player-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .video-card:hover .video-player-wrapper video {
            transform: scale(1.04);
        }

        .video-info {
            display: flex;
            gap: 12px;
        }

        .avatar {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            background-color: #555;
            border-radius: 50%;
        }

        .video-details {
            min-width: 0;
        }

        .video-details h3 {
            margin: 0 0 4px;
            font-size: 0.95rem;
            font-weight: 500;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-clamp: 2;
            -webkit-line-clamp: 2;
        }

        .video-details p {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }


        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }


        @media (min-width: 640px) {
            .video-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 768px) {
            /* El layout pasa a sidebar + contenido */
            body {
                grid-template-columns: 72px 1fr;
                grid-template-rows: var(--header-h) 1fr;
                grid-template-areas:
                    "header header"
                    "nav    main";
            }

            .sidebar {
                position: sticky;
                top: var(--header-h);
                align-self: start;
                height: calc(100vh - var(--header-h));
                border-top: none;
                border-right: 1px solid var(--border);
                padding: 12px 4px;
            }

            .sidebar ul {
                flex-direction: column;
                justify-content: flex-start;
                gap: 20px;
                height: auto;
            }

            .nav-item {
                width: 100%;
            }

            .content {
                padding: 24px;
            }
        }

        @media (min-width: 1024px) {
            body {
                grid-template-columns: 240px 1fr;
            }

            .sidebar {
                padding: 12px;
            }

            .nav-item {
                flex-direction: row;
                gap: 20px;
                padding: 10px 16px;
                font-size: 0.9rem;
            }

            .video-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 1440px) {
            .video-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <a href="index.html" class="logo-area" aria-label="Ir al inicio">
            <span class="logo-icon">YouTube</span>
        </a>
        <input type="search" id="search-input" class="search-bar" placeholder="Buscar videos..." aria-label="Buscar videos">
        <div class="account">Account</div>
    </header>


    <nav class="sidebar" aria-label="Navegación principal">
        <ul>
            <li><a href="index.html" class="nav-item">🏠 <span>Inicio</span></a></li>
            <li><a href="#" class="nav-item">📹 <span>Videos</span></a></li>
            <li><a href="#" class="nav-item">📚 <span>Suscripciones</span></a></li>
            <li><a href="#" class="nav-item">📁 <span>Biblioteca</span></a></li>
        </ul>
    </nav>


    <main class="content">
        <p id="status-message" class="status-message" role="status">Cargando videos...</p>
        <section class="video-grid" id="video-container" aria-label="Catálogo de videos">

        </section>
    </main>

    <script>
        "use strict";


        const API_URL = "http://localhost:8000";


        const container = document.getElementById("video-container");
        const statusMessage = document.getElementById("status-message");
        const searchInput = document.getElementById("search-input");

        let allVideos = [];


        function createElement(tag, className, text) {
            const element = document.createElement(tag);
            if (className) element.classList.add(className);
            if (text) element.textContent = text;
            return element;
        }

        function goToVideo(id) {
            window.location.href = `watch.html?id=${encodeURIComponent(id)}`;
        }

        function createVideoCard(video, index) {
            const card = createElement("article", "video-card");
            card.tabIndex = 0;
            card.style.animationDelay = `${Math.min(index * 0.05, 0.5)}s`;
            card.addEventListener("click", () => goToVideo(video.id));
            card.addEventListener("keydown", (event) => {
                if (event.key === "Enter") goToVideo(video.id);
            });


            const playerWrapper = createElement("div", "video-player-wrapper");
            const videoElement = document.createElement("video");
            videoElement.src = video.source; 
            if (video.thumbnail) videoElement.poster = video.thumbnail; 
            videoElement.controls = false;
            videoElement.muted = true;
            videoElement.preload = "metadata";
            playerWrapper.appendChild(videoElement);

            // Metadatos (avatar + textos)
            const info = createElement("div", "video-info");
            const avatar = createElement("div", "avatar");

            const details = createElement("div", "video-details");
            details.appendChild(createElement("h3", null, video.titulo));
            details.appendChild(createElement("p", null, video.category || "Canal de Streaming"));
            details.appendChild(createElement("p", null, video.descripcion));

            info.appendChild(avatar);
            info.appendChild(details);

            card.appendChild(playerWrapper);
            card.appendChild(info);
            return card;
        }

        function renderVideos(videos) {
            container.replaceChildren(); 

            if (videos.length === 0) {
                statusMessage.textContent = "No se encontraron videos.";
                statusMessage.hidden = false;
                return;
            }

            statusMessage.hidden = true;
            const fragment = document.createDocumentFragment();
            videos.forEach((video, index) => fragment.appendChild(createVideoCard(video, index)));
            container.appendChild(fragment);
        }


        searchInput.addEventListener("input", () => {
            const query = searchInput.value.trim().toLowerCase();
            const filtered = allVideos.filter((video) =>
                (video.titulo || "").toLowerCase().includes(query) ||
                (video.category || "").toLowerCase().includes(query)
            );
            renderVideos(filtered);
        });

        async function loadVideos() {
            try {
                const response = await fetch(`${API_URL}/videos/`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                allVideos = await response.json();
                renderVideos(allVideos);
            } catch (error) {
                console.error("Error al conectar con la API:", error);
                statusMessage.textContent = "No se pudo conectar con la API.";
            }
        }

        loadVideos();
    </script>
</body>
</html>
